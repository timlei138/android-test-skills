app: com.zui.calendar
name: ZUI 日历（联想平板）
导航入口:
  课程表模块: 进入主页 → 点击右上角"更多" → 弹窗中点击"课程表"
  新建课程表: 课程表列表页右上角"+"（action_add_schedule）
  从图片导入: 课程表模块空状态/相关入口（btnImportFromPhoto）
场景:
  - 新建课程表单（EditCourseActivity）
  - 时段设置·时间选择器（TimeSlotSettingsActivity）
界面结构:
  新建课程表单:
    课程名: 必填输入框，用 Type 输入中文
    上课周数: 弹窗为 1-20 周网格，点按切换选中状态
    课程时间: 点击行弹出节次选择（Canvas 滚轮）
  时间选择器（Canvas 双滚轮）:
    左滚轮: 开始时间（小时 + 分钟）
    右滚轮: 结束时间（小时 + 分钟）
    滚轮规律: 中间高亮=当前选中；上方的数字更小、下方更大
    切换方式: 点按上/下方未选中的数字可直接切换选中，无需滑动
    滑动规律: 手指上滑=数值增大，下滑=数值减小；容易过头，优先点按
高效操作:
  - 例: 分钟轮中间是 08，想设为 05 → 直接点击 08 上方两个位置的数字
  - 例: 想从 20 改到 30 → 点击 20 下方数字或手指上滑 1 格
  - 课程名输入: 先点击输入框聚焦，再用 Type
  - 周次选择: 点按数字切换；"单周/双周/全选"按钮可批量切换
跨应用出口:
  - 课程/时段设置中若出现"附件/文件"入口 → 会打开系统"打开方式"选择器 → 可能进入文件管理器
  - 从文件管理器返回后应回到原界面（Back 或页面返回键）
已知坑:
  - 左滚轮是开始时间、右滚轮是结束时间，两者不要混淆
  - 滑动滚轮极易过头或滑错列，改时间优先用点按数字
  - 上课周数里被其他课程占用的周次点不动（正常业务保护，不是 Bug）
  - 页面右上角"完成"= 保存并返回，对话框里"确定"= 确认当前选择
验证要点:
  - 时间选择器: 点"确定"后，看背景列表该节课时间是否已更新为目标值
  - 新建课程: 保存后看课表/课程列表是否出现该课程（含课程名与周次）
