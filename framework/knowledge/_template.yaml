# App 知识卡模板
# ─────────────────────────────────────────────────
# 用法：复制本文件为 <包名>.yaml（如 com.example.app.yaml），填写内容。
# 测试时框架会按当前前台包名自动找到对应知识卡注入给 AI/执行者。
# 不会写？直接告诉 AI："记一下：<你的知识>"，它会帮你填。
# ─────────────────────────────────────────────────

app: com.example.app            # App 包名（必填，知识卡索引键）
name: 示例 App                  # 显示名（可选）

# 前置条件：测试这个 App 前必须满足的条件（不满足时用例应标 BLOCKED）
前置条件:
  - 示例: 首次使用需先 pm clear com.example.app
  - 示例: 解析功能需要设备联网

# 导航入口：怎么进入各功能页（使用者口述的经验放这里）
导航入口:
  功能页A: 主页 → 点击XX → 点击YY
  功能页B: 从XX页 → 右上角菜单 → YY

# 界面结构：关键控件的结构与规律（Canvas 控件尤其要记）
界面结构:
  时间选择器:
    左滚轮: 开始时间
    右滚轮: 结束时间
    切换方式: 点按上/下方数字直接切换，比滑动准

# 高效操作：使用者知道的"捷径/技巧"
高效操作:
  - 示例: 改时间优先点按数字，滑动容易过头
  - 示例: 输入框必填校验有 Toast 提示

# 跨应用出口：点某处会跳到别的 App/系统界面
跨应用出口:
  - 示例: 点"附件"会打开系统选择器 → 文件管理器

# 已知坑：容易踩的坑（模型/新手常犯）
已知坑:
  - 示例: 左滚轮是开始时间，右滚轮是结束时间，别混淆
  - 示例: 被占用的周次点不动是正常保护逻辑，不是 Bug

# 验证要点：操作后怎么确认成功
验证要点:
  - 示例: 保存后看列表是否出现新条目
